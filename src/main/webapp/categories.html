<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>航空电子元件库存管理系统 - 分类管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <h2>航材库存管理</h2>
        <a href="dashboard.html">首页</a>
        <a href="components.html">元件管理</a>
        <a href="inventory.html">出入库管理</a>
        <a href="categories.html?v=20260716-2" class="active">分类管理</a>
        <a href="suppliers.html">供应商管理</a>
        <a href="profile.html">个人中心</a>
        <span class="user-info">欢迎, <span id="currentUser">管理员</span> | <a href="logout">退出</a></span>
    </nav>

    <div class="main-content">
        <div class="panel">
            <div class="panel-header">
                <h3>元件分类管理</h3>
                <div class="panel-toolbar">
                    <input type="text" id="searchInput" placeholder="搜索分类名称或描述..." style="min-width: 200px;">
                    <button class="btn btn-primary btn-sm" onclick="searchCategories()">查询</button>
                    <button class="btn btn-cancel btn-sm" onclick="resetFilter()">重置</button>
                    <button class="btn btn-success btn-sm" onclick="showAddCategory()">+ 新增分类</button>
                </div>
            </div>
            <table>
                <thead><tr><th>ID</th><th>分类名称</th><th>描述</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody id="categoryBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <h3 id="catModalTitle">新增分类</h3>
            <input type="hidden" id="catEditId">
            <div class="form-group"><label>分类名称 *</label><input type="text" id="catName"></div>
            <div class="form-group"><label>描述</label><textarea id="catDesc"></textarea></div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeCatModal()">取消</button>
                <button class="btn btn-primary" id="categorySubmitBtn" onclick="saveCategory()">保存</button>
            </div>
        </div>
    </div>

    <script src="js/jquery-3.7.0.min.js"></script>
    <script>
        var user = sessionStorage.getItem('user');
        if (user) { $('#currentUser').text(JSON.parse(user).realName || JSON.parse(user).username); }

        function escapeHtml(value) {
            return $('<div>').text(value == null ? '' : String(value)).html();
        }

        function renderCategories(list) {
            var html = '';
            for (var i = 0; i < list.length; i++) {
                var c = list[i];
                html += '<tr><td>' + escapeHtml(c.id) + '</td><td>' + escapeHtml(c.name) + '</td>'
                    + '<td>' + escapeHtml(c.description || '-') + '</td><td>' + escapeHtml(c.createTime || '') + '</td>'
                    + '<td><button class="btn btn-primary btn-sm js-edit-category" data-id="' + escapeHtml(c.id) + '">编辑</button> '
                    + '<button class="btn btn-danger btn-sm js-delete-category" data-id="' + escapeHtml(c.id)
                    + '">删除</button></td></tr>';
            }
            $('#categoryBody').html(html);
        }

        function loadCategories() {
            $.ajax({
                url: 'category?action=list',
                method: 'GET',
                dataType: 'json',
                cache: false
            }).done(function(res) {
                if (res.code === 200) {
                    renderCategories(res.data || []);
                }
            });
        }

        function showAddCategory() {
            $('#catModalTitle').text('新增分类');
            $('#catEditId').val(''); $('#catName').val(''); $('#catDesc').val('');
            $('#categoryModal').addClass('show');
        }

        function editCategory(id) {
            $.get('category?action=detail&id=' + id, function(res) {
                if (res.code === 200) {
                    var c = res.data;
                    $('#catModalTitle').text('编辑分类');
                    $('#catEditId').val(c.id);
                    $('#catName').val(c.name);
                    $('#catDesc').val(c.description);
                    $('#categoryModal').addClass('show');
                }
            });
        }

        function closeCatModal() { $('#categoryModal').removeClass('show'); }

        var categorySaving = false;

        function saveCategory() {
            if (categorySaving) { return; }
            var data = { name: $('#catName').val().trim(), description: $('#catDesc').val().trim() };
            if (!data.name) { alert('分类名称不能为空'); return; }
            var editId = $('#catEditId').val();
            if (editId) { data.id = parseInt(editId); }
            var action = editId ? 'update' : 'add';
            categorySaving = true;
            $('#categorySubmitBtn').prop('disabled', true).text('保存中...');

            $.ajax({
                url: 'category?action=' + action,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                processData: false,
                success: function(res) {
                    if (res.code === 200) { closeCatModal(); loadCategories(); alert('保存成功'); }
                    else { alert(res.msg || '保存失败'); }
                },
                complete: function() {
                    categorySaving = false;
                    $('#categorySubmitBtn').prop('disabled', false).text('保存');
                }
            });
        }

        function deleteCategory(id, name) {
            if (!confirm('确定删除分类【' + name + '】吗？\n注意: 该分类下的元件不会被删除。')) return;
            $.get('category?action=delete&id=' + id, function(res) {
                if (res.code === 200) { loadCategories(); alert('删除成功'); }
                else { alert(res.msg || '删除失败'); }
            });
        }

        function searchCategories() {
            var keyword = $('#searchInput').val().trim();
            $.ajax({
                url: 'category?action=search&keyword=' + encodeURIComponent(keyword),
                method: 'GET',
                dataType: 'json',
                cache: false
            }).done(function(res) {
                if (res.code === 200) {
                    renderCategories(res.data || []);
                }
            });
        }

        function resetFilter() {
            $('#searchInput').val('');
            loadCategories();
        }

        $('#categoryBody').on('click', '.js-edit-category', function() {
            editCategory($(this).attr('data-id'));
        });
        $('#categoryBody').on('click', '.js-delete-category', function() {
            var name = $(this).closest('tr').children('td').eq(1).text();
            deleteCategory($(this).attr('data-id'), name);
        });

        loadCategories();
    </script>
</body>
</html>
