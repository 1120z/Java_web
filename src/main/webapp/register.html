<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航空电子元件库存管理系统 - 注册</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <!-- 左侧 Hero -->
    <div class="login-hero">
        <div class="hero-codes">
            NEW USER REGISTRATION<br>
            ACCESS LEVEL: OPERATOR<br>
            REQUIRED FIELDS: 4<br>
            PASSWORD POLICY: NONE
        </div>

        <span class="hero-tag">AVIATION // REGISTER // v1.0</span>

        <h1 class="hero-title">
            Create
            <span class="accent">Account.</span>
        </h1>

        <p class="hero-subtitle">
            新用户注册<br>
            Register as Inventory Operator<br>
            Access Aviation Components Database
        </p>

        <div class="hero-stats">
            <div class="hero-stat">
                <span class="hero-stat-value">3</span>
                <span class="hero-stat-label">已有用户</span>
            </div>
            <div class="hero-stat">
                <span class="hero-stat-value">operator</span>
                <span class="hero-stat-label">默认角色</span>
            </div>
        </div>
    </div>

    <!-- 右侧注册卡 -->
    <div class="login-form-side">
        <div class="login-container with-corners">
            <div class="login-header">
                <span class="label">// NEW ACCOUNT</span>
                <h1>用户注册</h1>
                <p>Create Your Account</p>
            </div>

            <form id="registerForm" class="login-form">
                <div class="form-group">
                    <label for="username">用户名 / Username</label>
                    <input type="text" id="username" placeholder="enter username" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="password">密码 / Password</label>
                    <input type="password" id="password" placeholder="enter password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码 / Confirm</label>
                    <input type="password" id="confirmPassword" placeholder="confirm password" required>
                </div>
                <div class="form-group">
                    <label for="realName">真实姓名 / Real Name</label>
                    <input type="text" id="realName" placeholder="enter real name" autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary btn-block">创 建 账 号</button>
                <p class="login-hint">已有账号？<a href="index.html" style="color: var(--accent-cobalt-bright); text-decoration: none;">返回登录</a></p>
            </form>
        </div>
    </div>

    <script src="js/jquery-3.7.0.min.js"></script>
    <script>
        $(function() {
            $('#registerForm').on('submit', function(e) {
                e.preventDefault();
                var username = $('#username').val().trim();
                var password = $('#password').val();
                var confirmPassword = $('#confirmPassword').val();
                var realName = $('#realName').val().trim();

                if (!username || !password) {
                    alert('用户名和密码不能为空');
                    return;
                }
                if (password !== confirmPassword) {
                    alert('两次输入的密码不一致');
                    return;
                }

                $.ajax({
                    url: 'user?action=register',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        username: username,
                        password: password,
                        realName: realName
                    }),
                    success: function(res) {
                        if (res.code === 200) {
                            alert('注册成功，请登录');
                            window.location.href = 'index.html';
                        } else {
                            alert(res.msg || '注册失败');
                        }
                    },
                    error: function() {
                        alert('服务器连接失败');
                    }
                });
            });
        });
    </script>
</body>
</html>
